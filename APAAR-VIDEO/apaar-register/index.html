<!doctype html>
<html><head><meta charset="utf-8"><title>APAAR Student Register: a living screencast</title>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#e9e4d8}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
/* desktop: warm paper wallpaper (the painted world the app floats on) */
#wall{position:absolute;left:-1400px;top:-1000px;width:6000px;height:4400px;background:
  radial-gradient(1000px 700px at 1700px 1100px,#f4ead6 0,transparent 70%),
  radial-gradient(1100px 800px at 3000px 1900px,#e8ddc6 0,transparent 70%),#ece4d3}
/* the browser window holding the real app */
.f-win{position:absolute;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(16,32,64,.12),0 30px 80px rgba(40,30,10,.22),0 8px 24px rgba(40,30,10,.14)}
.f-win .f-bar{height:40px;background:#eef1f0;border-bottom:1px solid #d5dedb;display:flex;align-items:center;padding:0 14px;gap:14px;font:14px "Atkinson Hyperlegible";color:#4a5a70}
.f-win .f-bar i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;background:#d9d4c8}
.f-win .f-url{flex:1;max-width:620px;margin:0 auto;height:26px;border-radius:7px;background:#fff;border:1px solid #d5dedb;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:13.5px}
.f-win .f-url b{font-weight:400;color:#1b2a41}
.f-win .f-vp{position:absolute;left:0;top:40px;width:1440px;height:810px;overflow:hidden;background:var(--paper,#f3f6f5)}
.f-win .f-doc{position:absolute;left:0;top:0;width:1440px}
#paint,#under{position:absolute;left:0;top:0}
#hud{position:absolute;inset:0;pointer-events:none;font-family:"Atkinson Hyperlegible"}
.f-cap{position:absolute;left:50%;bottom:44px;max-width:1300px;padding:12px 26px;border-radius:14px;background:rgba(18,30,52,.72);backdrop-filter:blur(10px);color:#fff;font-size:34px;line-height:1.3;text-align:center;white-space:pre-line}
.f-cap em{font-style:normal;color:#ffc79f}
.f-chap{position:absolute;left:44px;top:36px;display:flex;align-items:center;gap:12px;padding:9px 18px 9px 12px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(16,32,64,.12);font-size:22px;color:#1b2a41}
.f-chap b{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#12387a;color:#fff;font-size:16px}
.f-chap s{text-decoration:none;width:8px;height:8px;border-radius:50%;background:#f37021}
.f-ramp{position:absolute;right:56px;top:40px;padding:8px 16px;border-radius:10px;background:rgba(18,30,52,.78);color:#fff;font-size:22px;font-weight:700;letter-spacing:.02em}
.f-keys{position:absolute;right:56px;bottom:150px;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:rgba(18,30,52,.72);color:#fff;font-size:18px}
.f-keys i{font-style:normal;min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:#fff;color:#1b2a41;font-size:20px;font-weight:700;box-shadow:0 3px 0 #b9c6c2}
.f-keys i.dn{transform:translateY(3px);box-shadow:0 0 0 #b9c6c2}
.f-keys span{margin-left:6px;color:#dbe3f0}
.f-spot{position:absolute;inset:0}
.f-fade{position:absolute;inset:0;background:#0a2556}
.f-wipe{position:absolute;inset:0;overflow:hidden}
.f-wlabel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff}
.f-wlabel .no{font-size:30px;opacity:.85;letter-spacing:.08em}
.f-wlabel .nm{font-size:76px;font-weight:700;letter-spacing:-.01em}
</style>
<link rel="stylesheet" href="app.css">
<style>
/* the app's own stylesheet styles .f-win .doc; keep the film's own layers out of its reach */
.f-doc{font-family:var(--sans)}
.f-end{position:absolute;left:50%;top:330px;transform:translateX(-50%);width:1180px;padding:44px 56px 40px;border-radius:20px;background:rgba(10,37,86,.88);backdrop-filter:blur(6px);text-align:center;color:#fff}
.f-end .a{font-size:30px;letter-spacing:.04em;color:#ffc79f;margin-bottom:14px}
.f-end .b{font-size:58px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.f-end .c{margin-top:26px;font-size:28px;color:#dbe3f0;font-family:"IBM Plex Mono",monospace}
.f-end .d{margin-top:18px;font-size:22px;color:#9fb0cf}
.f-doc .overlay{position:absolute!important;left:0;top:var(--scroll,0px);width:1440px;height:810px}
</style>
</head><body>
<div id="stage">
  <div class="layer" id="walll"><div id="wall"></div></div>
  <canvas id="under" width="1920" height="1080"></canvas>
  <div class="layer" id="world"><div id="wins"></div></div>
  <canvas id="paint" width="1920" height="1080"></canvas>
  <div id="hud"></div>
</div>
<script type="module" src="main.js"></script>
</body></html>
